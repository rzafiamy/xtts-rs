[workspace]
resolver = "2"
members = ["crates/xtts", "crates/xtts-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/rzafiamy/xtts-rs"
keywords = ["tts", "candle", "xtts", "gguf", "speech"]
categories = ["multimedia::audio", "science"]

[workspace.dependencies]
candle-core = "0.11"
candle-nn = "0.11"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.21.0", default-features = false, features = ["onig"] }
tracing = "0.1"
hound = "3.5"
rand = "0.9"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
