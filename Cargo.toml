[workspace]
resolver = "2"
members = ["crates/xtts", "crates/xtts-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/rzafiamy/xtts-rs"
keywords = ["tts", "candle", "xtts", "gguf", "speech"]
categories = ["multimedia::audio", "science"]

[workspace.dependencies]
candle-core = "0.11"
candle-nn = "0.11"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.21.0", default-features = false, features = ["onig"] }
tracing = "0.1"
hound = "3.5"
rand = "0.9"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# CUDA kernels for GPUs older than compute 7.0 (GTX 10xx): candle 0.11.0 plus
# small fixes, see https://github.com/SimoneAvogadro/candle/tree/older-nvidia-gpus
# All the candle crates come from there, so each exists only once in the build.
[patch.crates-io]
candle-core = { git = "https://github.com/SimoneAvogadro/candle", rev = "f083eef12e60157f281238c21400476293a90c58" }
candle-kernels = { git = "https://github.com/SimoneAvogadro/candle", rev = "f083eef12e60157f281238c21400476293a90c58" }
candle-metal-kernels = { git = "https://github.com/SimoneAvogadro/candle", rev = "f083eef12e60157f281238c21400476293a90c58" }
candle-nn = { git = "https://github.com/SimoneAvogadro/candle", rev = "f083eef12e60157f281238c21400476293a90c58" }
candle-ug = { git = "https://github.com/SimoneAvogadro/candle", rev = "f083eef12e60157f281238c21400476293a90c58" }
